<main class="page">
    <app-wow-frame>
        <div class="wow-page">
            <header class="page-header" [class.page-header--compact]="compactNav()">
                @if (compactNav()) {
                    <app-wow-nav-menu class="page-menu" [links]="links" />
                }
                <app-wow-button class="page-back" link="/wow-forever">← Lanzador</app-wow-button>
                <h1 class="title">{{ heading() }}</h1>
                <app-wow-button class="page-back" link="/">← NTG</app-wow-button>
            </header>

            <div class="content">
                <ng-content />
            </div>

            @if (credit(); as text) {
                <p class="credit">{{ text }}</p>
            }
        </div>
    </app-wow-frame>
</main>
