<section class="selection-panel">
    <div class="section-heading">
        <span>// WILD POKEMON APPEARED</span>
        <small>Choose one Pokémon to add to your team</small>
    </div>

    <div class="pokemon-grid">
        @for (pokemon of store.wildPokemonOptions(); track pokemon.id) {
            <button type="button" class="pokemon-card" [class.selected]="store.isPokemonSelected(pokemon)" (click)="store.selectPokemon(pokemon)">
                <img class="pokemon-image" [src]="pokemon.imageUrl" [alt]="pokemon.name">
                <div class="pokemon-name">{{ pokemon.name }}</div>
                <div class="chip-row">
                    @for (type of pokemon.types; track type) {
                        <span class="type-chip {{ store.getTypeClass(type) }}">{{ type }}</span>
                    }
                </div>
                <div class="stats-grid">
                    <span>HP {{ pokemon.maxHp }}</span>
                    <span>ATK {{ pokemon.attack }}</span>
                    <span>DEF {{ pokemon.defense }}</span>
                    <span>SPD {{ pokemon.speed }}</span>
                </div>
            </button>
        }
    </div>

    <div class="action-row">
        <button class="primary-action" type="button" [disabled]="!store.selectedPokemon()" (click)="store.keepSelectedPokemon()">AÑADIR</button>
        <button class="secondary-action" type="button" (click)="store.skipPokemonReward()">KEEP TEAM</button>
    </div>
</section>
