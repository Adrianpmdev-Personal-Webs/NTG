<section class="trade-panel">
    <div class="trade-card">
        <div class="trade-symbol">⇄</div>
        <h2>TRADE OFFER</h2>
        <p>Sacrifica el segundo Pokémon del equipo para mejorar el nivel y rareza del primero.</p>
        <div class="action-row centered">
            <button class="primary-action" type="button" (click)="store.acceptTrade()">ACEPTAR</button>
            <button class="secondary-action" type="button" (click)="store.declineTrade()">DECLINE</button>
        </div>
    </div>
</section>
