<div class="modal-overlay" appModalOverlay (dismiss)="dismiss.emit()">
    <div class="modal terminal-card" role="dialog" aria-modal="true" aria-labelledby="series-editor-title">
        <div class="modal-header">
            <h2 class="modal-title" id="series-editor-title">RESULTADO DE LA SERIE</h2>
            <button class="close-btn" type="button" aria-label="Cerrar" (click)="dismiss.emit()">✕</button>
        </div>

        <div class="modal-body">
            <p class="terminal-line">
                {{ name(1) }} <strong>{{ score()[0] }} - {{ score()[1] }}</strong> {{ name(2) }}
            </p>

            <div class="form-grid">
                @for (game of visibleGames(); track $index) {
                    <div class="form-field">
                        <span class="field-label">PARTIDA {{ $index + 1 }}</span>
                        <div class="check-group">
                            <label class="check-option">
                                <input
                                    type="radio"
                                    [name]="'winner-' + $index"
                                    [checked]="game.winnerSide === 1"
                                    (change)="setWinner($index, 1)"
                                />
                                Gana {{ name(1) }}
                            </label>
                            <label class="check-option">
                                <input
                                    type="radio"
                                    [name]="'winner-' + $index"
                                    [checked]="game.winnerSide === 2"
                                    (change)="setWinner($index, 2)"
                                />
                                Gana {{ name(2) }}
                            </label>
                        </div>
                        <input
                            class="neon-input"
                            type="url"
                            placeholder="https://replay.pokemonshowdown.com/..."
                            [ngModel]="game.replayUrl"
                            (ngModelChange)="setReplay($index, $event)"
                        />
                    </div>
                }
            </div>

            <div class="modal-actions">
                @if (removable()) {
                    <button
                        class="btn-neon btn-neon-danger"
                        type="button"
                        (click)="remove.emit()"
                        [disabled]="saving()"
                    >
                        ELIMINAR SERIE
                    </button>
                }
                <button class="btn-neon btn-neon-warning" type="button" (click)="clear()" [disabled]="saving()">
                    VACIAR
                </button>
                <button class="btn-neon btn-neon-danger" type="button" (click)="dismiss.emit()" [disabled]="saving()">
                    CANCELAR
                </button>
                <button class="btn-neon" type="button" (click)="submit()" [disabled]="saving()">GUARDAR</button>
            </div>
        </div>
    </div>
</div>
