<main class="launcher-page">
    <app-wow-frame>
        <div class="launcher-shell">
            <app-launcher-header />

            <section class="launcher-main">
                <div class="artwork-layer" [style.background-image]="'url(' + backgroundUrl() + ')'" aria-hidden="true"></div>
                <div class="artwork-vignette" aria-hidden="true"></div>
                <div class="content-spacer"></div>
                <app-news-panel />
            </section>

            <section class="launcher-navigation">
                <div class="launcher-version">
                    <label for="game-version">Versión del juego</label>
                    <select
                        id="game-version"
                        aria-label="Facción"
                        [value]="faction()"
                        (change)="onFactionChange($any($event.target).value)">
                        <option value="ALLIANCE">Alianza</option>
                        <option value="HORDE">Horda</option>
                    </select>
                </div>

                <nav class="utility-links" aria-label="Herramientas de WoW Forever">
                    <div class="resource-link-row">
                        @for (feature of features; track feature.id) {
                            @if (feature.available) {
                                <a class="tiny-link" [routerLink]="feature.route">{{ feature.label }}</a>
                            } @else {
                                <span class="tiny-link disabled" title="Próximamente" aria-disabled="true">{{ feature.label }}</span>
                            }
                        }
                    </div>
                </nav>

                <div class="play-area">
                    <app-wow-button [large]="true">JUGAR</app-wow-button>
                </div>
            </section>

            <app-legal-notice />
        </div>
    </app-wow-frame>
</main>
