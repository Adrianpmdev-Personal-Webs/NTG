<aside class="team-panel">
    <div class="panel-title"><span>// TEAM</span><small>{{ store.teamSlotsLabel() }}</small></div>
    @if (store.team().length === 0) {
        <div class="empty-state">SIN POKÉMON</div>
    } @else {
        <div class="team-list">
            @for (pokemon of store.team(); track pokemon.id) {
                <article class="team-row">
                    <img [src]="pokemon.imageUrl" [alt]="pokemon.name">
                    <div class="team-info">
                        <strong>{{ pokemon.name }}</strong>
                        <div class="health-bar"><span [style.width.%]="store.getHealthPercent(pokemon)"></span></div>
                    </div>
                    <small>LVL {{ pokemon.level }}</small>
                </article>
            }
        </div>
    }
</aside>
