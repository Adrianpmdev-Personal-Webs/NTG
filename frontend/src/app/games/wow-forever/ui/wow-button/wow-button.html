<ng-template #content>
    <span class="wow-button__shine"></span>
    <span class="wow-button__label"><ng-content /></span>
</ng-template>

@if (link(); as target) {
    <a
        class="wow-button"
        [class.wow-button--large]="large()"
        [class.wow-button--block]="block()"
        [routerLink]="target"
        [attr.aria-label]="label() ?? null"
    >
        <ng-container [ngTemplateOutlet]="content" />
    </a>
} @else {
    <button
        class="wow-button"
        [class.wow-button--large]="large()"
        [class.wow-button--block]="block()"
        [disabled]="disabled()"
        [attr.aria-label]="label() ?? null"
        type="button"
    >
        <ng-container [ngTemplateOutlet]="content" />
    </button>
}
