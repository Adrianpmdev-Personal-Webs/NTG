<section class="selection-panel">
    <div class="section-heading">
        <span>// STARTER POKÉMON</span>
        <small>Choose one Pokémon to start your run</small>
    </div>

    <div class="pokemon-grid">
        @for (pokemon of store.starterOptions; track pokemon.id) {
            <button type="button" class="pokemon-card" (click)="store.selectStarter(pokemon)">
                <img class="pokemon-image" [src]="pokemon.imageUrl" [alt]="pokemon.name">
                <div class="pokemon-name">{{ pokemon.name }}</div>
                <div class="chip-row">
                    @for (type of pokemon.types; track type) {
                        <span class="type-chip {{ store.getTypeClass(type) }}">{{ type }}</span>
                    }
                </div>
                <div class="stats-grid">
                    <span>HP {{ pokemon.maxHp }}</span>
                    <span>ATK {{ pokemon.attack }}</span>
                    <span>DEF {{ pokemon.defense }}</span>
                    <span>SPD {{ pokemon.speed }}</span>
                </div>
            </button>
        }
    </div>
</section>
