<section class="end-panel">
    @if (store.currentPhase() === 'badge') {
        <img [src]="store.assets.icons.badge" alt="Badge">
        <h2>BADGE EARNED!</h2>
        <p>Badges: {{ store.badgesLabel() }}</p>
        <button class="primary-action" type="button" (click)="store.claimBadge()">CLAIM BADGE</button>
    }

    @if (store.currentPhase() === 'gameOver') {
        <h2>GAME OVER</h2>
        <p>Tu equipo cayó antes de completar la run.</p>
        <button class="primary-action" type="button" (click)="store.restartRun()">NUEVA RUN</button>
    }

    @if (store.currentPhase() === 'hallOfFame') {
        <img [src]="store.assets.icons.hallOfFame" alt="Hall of Fame">
        <h2>HALL OF FAME</h2>
        <p>Has completado la run con 8 medallas.</p>
        <button class="primary-action" type="button" (click)="store.restartRun()">VOLVER AL INICIO</button>
    }
</section>
