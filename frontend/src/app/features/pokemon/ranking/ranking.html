<section class="page">
    <h1 class="heading">Ranking histórico</h1>
    <p class="hint">Suma de todos los randomlockes. Cada randomlocke tiene además su propia clasificación, que empieza de cero.</p>

    @if (loading()) {
        <p class="state">Cargando…</p>
    } @else if (failed()) {
        <p class="state error">No se ha podido cargar el ranking.</p>
    } @else {
        <div class="card">
            <app-pokemon-standings-table [rows]="rows()" extraLabel="Títulos / torneos" />
        </div>
    }
</section>
