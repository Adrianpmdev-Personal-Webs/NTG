<ng-template #content>
    <span class="wow-button__shine"></span>
    <span class="wow-button__label"><ng-content /></span>
</ng-template>

@if (link(); as target) {
    <a class="wow-button" [class.wow-button--large]="large()" [routerLink]="target">
        <ng-container [ngTemplateOutlet]="content" />
    </a>
} @else {
    <button class="wow-button" [class.wow-button--large]="large()" [disabled]="disabled()" type="button">
        <ng-container [ngTemplateOutlet]="content" />
    </button>
}
